<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom fix C, 2026-09-27. `user-scalable=no` is GONE from the viewport meta
         above, deliberately. iOS has ignored it since iOS 10 on purpose -- zoom is an
         accessibility feature -- while Android Chrome honours it, so the tag was a real
         global pinch blocker on exactly the platform that respects it, and did nothing
         on the iPad in the house. The fix is ./tap-zoom-guard.js below, not the meta tag
         (INTERACTION-DIRECTION.md layer 4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b45ea8" />
    <meta name="description" content="A unicorn and princess flower-matching shooter for children." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Petal Kingdom" />
    <title>Petal Kingdom — Unicorn Flower Shooter</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./cg-back.css" />
  </head>
  <body>
    <main class="app-shell">
      <!-- ===================== TITLE SCREEN ===================== -->
      <section id="titleScreen" class="screen title-screen is-active" aria-label="Petal Kingdom title screen">
        <!-- Owner, 2026-08-27: *"need to make sure ALL games has back icon to the hub"* --
             a 4-year-old could not get out of the game. It lives INSIDE the title screen
             rather than fixed to the viewport, because `.screen` is absolute+inset:0 and
             only the active one displays: put here, the arrow appears and disappears with
             the title screen instead of hanging over the mode screen's own back button.
             Absolute URL on purpose: published, /flower-shooter/ and /children-apps/ are
             siblings, but in the repo the hub lives under site/, so a relative link would
             work live and 404 in every local preview. -->
        <a class="cg-back" href="https://veeranuchlee.github.io/children-apps/" aria-label="Back to Children Games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <div class="title-art" aria-hidden="true">
          <!-- ASSET SLOT: assets/art/title-card.png (1536x1024) drops in here as a background -->
          <div class="title-crest">
            <span class="crest-sparkle crest-sparkle--a"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2c.7 6.2 3.8 9.3 10 10-6.2.7-9.3 3.8-10 10-.7-6.2-3.8-9.3-10-10 6.2-.7 9.3-3.8 10-10z" fill="currentColor"/></svg></span>
            <span class="crest-sparkle crest-sparkle--b"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2c.7 6.2 3.8 9.3 10 10-6.2.7-9.3 3.8-10 10-.7-6.2-3.8-9.3-10-10 6.2-.7 9.3-3.8 10-10z" fill="currentColor"/></svg></span>
            <span class="crest-sparkle crest-sparkle--c"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2c.7 6.2 3.8 9.3 10 10-6.2.7-9.3 3.8-10 10-.7-6.2-3.8-9.3-10-10 6.2-.7 9.3-3.8 10-10z" fill="currentColor"/></svg></span>
          </div>
        </div>

        <h1 class="title-word">Petal Kingdom</h1>
        <p class="title-sub">Match three flowers to make them bloom!</p>

        <div class="title-buttons">
          <button class="big-button big-button--play" id="playButton" type="button">
            <!-- Drawn rose, not a flower emoji (owner rule, 2026-10-20: no
                 emoji in the UI). Same five round petals and gold heart the
                 canvas sprites wear, so the button matches the playfield. -->
            <span class="big-button__icon" aria-hidden="true">
              <svg class="icon-svg" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                <g fill="#F8467F" stroke="#C21C58" stroke-width="2">
                  <ellipse cx="24" cy="11.5" rx="6.4" ry="8"/>
                  <ellipse cx="24" cy="11.5" rx="6.4" ry="8" transform="rotate(72 24 24)"/>
                  <ellipse cx="24" cy="11.5" rx="6.4" ry="8" transform="rotate(144 24 24)"/>
                  <ellipse cx="24" cy="11.5" rx="6.4" ry="8" transform="rotate(216 24 24)"/>
                  <ellipse cx="24" cy="11.5" rx="6.4" ry="8" transform="rotate(288 24 24)"/>
                </g>
                <circle cx="24" cy="24" r="6.6" fill="#FFE07A" stroke="#E9A93B" stroke-width="2"/>
              </svg>
            </span>
            <span class="big-button__label">Play</span>
          </button>
          <button class="big-button big-button--ghost" id="howButton" type="button">
            <span class="big-button__icon" aria-hidden="true">?</span>
            <span class="big-button__label">How to play</span>
          </button>
        </div>

        <div class="title-footer">
          <!-- Both chips carry drawn icons (owner rule, 2026-10-20). The speaker
               follows the writing-book/vocab.js + math-app/magic-spelling.html
               precedent: currentColor body, round-capped waves, a slash when
               muted. app.js setSound() swaps the inner SVG the same way. -->
          <button class="chip-button" id="titleSoundButton" type="button" aria-pressed="true">
            <span aria-hidden="true">
              <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/>
                <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
            </span> <span class="chip-label">Sound on</span>
          </button>
          <button class="chip-button" id="titleMotionButton" type="button" aria-pressed="false">
            <span aria-hidden="true">
              <svg class="icon-svg" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                <path d="M24 7q3.1 13.9 17 17-13.9 3.1-17 17-3.1-13.9-17-17 13.9-3.1 17-17z" fill="#E8A020"/>
                <circle cx="36.5" cy="12" r="2.6" fill="#FFC94D"/>
              </svg>
            </span> <span class="chip-label">Full sparkle</span>
          </button>
        </div>
      </section>

      <!-- ===================== MODE SELECT ===================== -->
      <section id="modeScreen" class="screen mode-screen" aria-label="Choose a game mode">
        <header class="sub-header">
          <button class="round-button" id="modeBackButton" type="button" aria-label="Back to the title screen">
            <span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <h2 class="sub-title">Choose a mode</h2>
          <div class="header-spacer" aria-hidden="true"></div>
        </header>
        <div class="mode-grid">
          <!-- Mode icons are drawn, not tulip / monster / puzzle-piece emoji
               (owner rule, 2026-10-20), each painted in the app palette: a rose
               tulip on a mint stem, a violet invader with cream eyes, a
               bluebell puzzle piece. -->
          <button class="mode-card mode-card--classic" type="button" data-mode="classic">
            <span class="mode-icon" aria-hidden="true">
              <svg class="icon-svg" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                <path d="M24 34v10" fill="none" stroke="#2CC08A" stroke-width="3.2" stroke-linecap="round"/>
                <path d="M24 42c-6-.5-10-4.5-10.5-10 5.5.5 10 4 10.5 10z" fill="#2CC08A" stroke="#12855C" stroke-width="2" stroke-linejoin="round"/>
                <path d="M12 14v8a12 12 0 0 0 24 0v-8l-6 4.5L24 10l-6 8.5z" fill="#F8467F" stroke="#C21C58" stroke-width="2.2" stroke-linejoin="round"/>
              </svg>
            </span>
            <strong>Classic</strong>
            <span>Clear the garden while rows slowly descend.</span>
            <small>12 gardens</small>
          </button>
          <button class="mode-card mode-card--arcade" type="button" data-mode="arcade">
            <span class="mode-icon" aria-hidden="true">
              <svg class="icon-svg" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                <g stroke="#A45BE2" stroke-width="3.4" stroke-linecap="round" fill="none">
                  <path d="M16 13 12 7M32 13l4-6"/>
                  <path d="M10 20H4M10 27l-4 5M38 20h6M38 27l4 5"/>
                  <path d="M17 30v6M24 30v6M31 30v6"/>
                </g>
                <rect x="10" y="12" width="28" height="18" rx="9" fill="#A45BE2"/>
                <circle cx="19" cy="21" r="3.2" fill="#FFF6FB"/>
                <circle cx="29" cy="21" r="3.2" fill="#FFF6FB"/>
                <circle cx="19.8" cy="21.6" r="1.4" fill="#4A2350"/>
                <circle cx="29.8" cy="21.6" r="1.4" fill="#4A2350"/>
              </svg>
            </span>
            <strong>Arcade</strong>
            <span>Beat score, pop and drop challenges.</span>
            <small>8 challenges</small>
          </button>
          <button class="mode-card mode-card--puzzle" type="button" data-mode="puzzle">
            <span class="mode-icon" aria-hidden="true">
              <svg class="icon-svg" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                <path d="M13 21h3.8a5.6 5.6 0 1 1 10.4 0H30v3.8a5.6 5.6 0 1 1 0 10.4V38H13z" fill="#3E9BF0" stroke="#1662B4" stroke-width="2.2" stroke-linejoin="round"/>
              </svg>
            </span>
            <strong>Puzzle</strong>
            <span>Solve fixed flower maps with limited shots.</span>
            <small>8 puzzles</small>
          </button>
        </div>
      </section>

      <!-- ===================== LEVEL SELECT ===================== -->
      <section id="levelScreen" class="screen level-screen" aria-label="Choose a garden">
        <header class="sub-header">
          <button class="round-button" id="levelBackButton" type="button" aria-label="Back to the title screen">
            <span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <div class="level-heading">
            <span class="mode-pill" id="modePill">Classic</span>
            <h2 class="sub-title" id="levelTitle">Choose a garden</h2>
          </div>
          <div class="header-spacer" aria-hidden="true"></div>
        </header>
        <div class="level-grid" id="levelGrid" role="list"></div>
      </section>

      <!-- ===================== GAME SCREEN ===================== -->
      <section id="gameScreen" class="screen game-screen" aria-label="Flower shooter game">
        <div class="game-frame">
          <header class="game-hud">
            <button class="round-button" id="pauseButton" type="button" aria-label="Pause the game">
              <span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg></span>
            </button>

            <div class="hud-readouts">
              <div class="hud-item">
                <span class="hud-label" id="hudStageLabel">Garden</span>
                <span class="hud-value" id="hudLevel">1</span>
              </div>
              <div class="hud-item">
                <span class="hud-label">Score</span>
                <span class="hud-value" id="hudScore">0</span>
              </div>
              <div class="hud-item hud-item--goal">
                <span class="hud-label" id="hudGoalLabel">Flowers left</span>
                <span class="hud-value" id="hudGoal">0</span>
              </div>
            </div>

            <button class="round-button" id="soundButton" type="button" aria-pressed="true" aria-label="Turn sound off">
              <span aria-hidden="true">
                <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/>
                  <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                </svg>
              </span>
            </button>
          </header>

          <div class="stage-wrap">
            <canvas id="gameCanvas" class="game-canvas" role="img"
                    aria-label="Flower garden playfield. Use the arrow keys to aim and the space bar to shoot."></canvas>

            <!-- Helper character rail. ASSET SLOTS live here. -->
            <aside class="helper-rail" id="helperRail" aria-hidden="true">
              <div class="helper-figure" id="helperFigure" data-mood="idle">
                <!-- ASSET SLOT: assets/art/helper-idle.png / helper-cheer.png / helper-worry.png -->
                <div class="helper-fallback" id="helperFallback">
                  <div class="helper-horn"></div>
                  <div class="helper-face">
                    <span class="helper-eye helper-eye--l"></span>
                    <span class="helper-eye helper-eye--r"></span>
                    <span class="helper-smile"></span>
                  </div>
                  <div class="helper-mane"></div>
                </div>
              </div>
              <p class="helper-say" id="helperSay">Let's grow a garden!</p>
            </aside>
          </div>

          <footer class="game-foot">
            <div class="next-strip">
              <span class="next-label">Next</span>
              <canvas id="nextCanvas" class="next-canvas" aria-label="Next flower"></canvas>
              <button class="swap-button" id="swapButton" type="button" aria-label="Swap the flower you are holding">
                <span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              </button>
            </div>
            <p class="foot-hint" id="footHint">Tap where you want the flower to fly.</p>
          </footer>
        </div>
      </section>

      <!-- ===================== OVERLAYS ===================== -->
      <div class="overlay" id="overlay" hidden>
        <div class="overlay-card" id="overlayCard" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
          <div class="overlay-art" id="overlayArt" aria-hidden="true">
            <!-- ASSET SLOT: assets/art/win-banner.png on a win -->
            <!-- Default art is the drawn rose (was a flower emoji; owner rule
                 2026-10-20). app.js showOverlay() swaps in the crown, seedling,
                 daisy or unicorn SVG per result. -->
            <span class="overlay-emoji" id="overlayEmoji">
              <svg class="icon-svg" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                <g fill="#F8467F" stroke="#C21C58" stroke-width="2">
                  <ellipse cx="24" cy="11.5" rx="6.4" ry="8"/>
                  <ellipse cx="24" cy="11.5" rx="6.4" ry="8" transform="rotate(72 24 24)"/>
                  <ellipse cx="24" cy="11.5" rx="6.4" ry="8" transform="rotate(144 24 24)"/>
                  <ellipse cx="24" cy="11.5" rx="6.4" ry="8" transform="rotate(216 24 24)"/>
                  <ellipse cx="24" cy="11.5" rx="6.4" ry="8" transform="rotate(288 24 24)"/>
                </g>
                <circle cx="24" cy="24" r="6.6" fill="#FFE07A" stroke="#E9A93B" stroke-width="2"/>
              </svg>
            </span>
          </div>
          <h2 class="overlay-title" id="overlayTitle">Paused</h2>
          <p class="overlay-text" id="overlayText"></p>
          <div class="overlay-stars" id="overlayStars" hidden>
            <span class="star" data-star="1"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.8l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 16.9 6.6 19.7l1-6.1L3.2 9.3l6.1-.9z" fill="currentColor"/></svg></span>
            <span class="star" data-star="2"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.8l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 16.9 6.6 19.7l1-6.1L3.2 9.3l6.1-.9z" fill="currentColor"/></svg></span>
            <span class="star" data-star="3"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.8l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 16.9 6.6 19.7l1-6.1L3.2 9.3l6.1-.9z" fill="currentColor"/></svg></span>
          </div>
          <div class="overlay-buttons" id="overlayButtons"></div>
        </div>
      </div>
    </main>

    <!-- Zoom fix C (2026-09-25, owner: "pick the method that most likely to work well").
         First, before the game, because it is a document-level listener and must be in
         place before the game starts handling taps. It stops the ZOOM of a second quick
         tap -- and a four-year-old claiming targets by tapping them is exactly who taps
         twice -- and re-delivers that tap; a multi-finger pinch is never touched, so a
         child who is zoomed in can always pinch back out. It is NOT a gesturestart
         handler and must never become one: a document-level pinch blocker is the banned
         pattern in INTERACTION-DIRECTION.md. -->
    <script src="./tap-zoom-guard.js"></script>
    <script src="./audio-wake.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
